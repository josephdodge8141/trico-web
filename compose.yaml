name: trico-web-local

x-preview:
  version: 1
  router: caddy
  frontend: frontend
  backend: backend
  task:
    cpu: 2048
    memoryMiB: 4096

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    ports:
      - '8088:8088'
    environment:
      MAILPIT_USERNAME: local-editor
      # bcrypt for the local-only password documented in docs/preview-operations.md.
      MAILPIT_PASSWORD_HASH: '$$2y$$12$$4NtnM0Krnhgglj4XqsvjReKYGo7BEJZQSt8yy1s.DnavvqR0vDnde'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      mailpit:
        condition: service_healthy
    networks:
      default:
        aliases:
          - app.localhost

  dynamodb:
    image: amazon/dynamodb-local@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/data']
    user: root
    volumes:
      - dynamodb-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:8000/ >/dev/null || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_WEBROOT: /__mailpit/
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-environment
      APP_ENV: local
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: http://app.localhost:8088
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-local-minio-user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      AWS_REGION: us-west-2
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: trico-web-local
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: trico-web-local
      S3_FORCE_PATH_STYLE: 'true'
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: TriCo Website <website@tricoinc.com>
      SESSION_COOKIE_NAME: trico_local_session
      COOKIE_SECURE: 'false'
      BEDROCK_MODE: fixture
      BEDROCK_MODEL_ID: local-fixture
    depends_on:
      dynamodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['node', 'backend/dist/seed.js']
    environment:
      <<: *backend-environment
      BOOTSTRAP_MODE: seed-if-empty
      PREVIEW_EDITOR_EMAIL: ${PREVIEW_EDITOR_EMAIL:-editor@tricoinc.com}
      PREVIEW_EDITOR_PASSWORD: ${PREVIEW_EDITOR_PASSWORD:-local-preview-password}
    depends_on:
      dynamodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: 'no'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SITE_ADDRESS: ':80'
      MAILPIT_USERNAME: local-editor
      MAILPIT_PASSWORD_HASH: '$$2y$$12$$4NtnM0Krnhgglj4XqsvjReKYGo7BEJZQSt8yy1s.DnavvqR0vDnde'
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  dynamodb-data:
  minio-data:
